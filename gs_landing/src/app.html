<!doctype html>
<html lang="en-IN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#FAFAF7" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" media="(prefers-color-scheme: light)" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="%sveltekit.assets%/gardensuite-icon-white.svg"
			media="(prefers-color-scheme: dark)"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/app-icon-512.png" />
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/inter-latin-var.woff2"
			crossorigin
		/>
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="%sveltekit.assets%/fonts/plus-jakarta-sans-latin-var.woff2"
			crossorigin
		/>
		<script>
			try {
				if (sessionStorage.getItem('gs_preloader_shown') === 'true') {
					document.documentElement.classList.add('skip-preloader');
				}
			} catch (e) {}
		</script>
		<script type="speculationrules">
			{
				"prerender": [
					{
						"where": {
							"and": [{ "href_matches": "/products/*" }, { "not": { "href_matches": "/*#*" } }]
						},
						"eagerness": "moderate"
					}
				]
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
